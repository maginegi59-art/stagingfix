# XcodeGen spec for StagingFix.
# Layout expected next to this file:
#   App/                 — the SwiftUI app sources in this folder
#   ../IDeviceKit/       — a local clone of https://github.com/khcrysalis/IDeviceKit
#                          with StagingFixer.swift copied into
#                          Sources/IDeviceSwift/AFC/
# Generate with:  xcodegen generate
name: StagingFix
options:
  bundleIdPrefix: app.stagingfix
  deploymentTarget:
    iOS: "17.4"
packages:
  IDeviceKit:
    path: ../IDeviceKit
targets:
  StagingFix:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stagingfix.StagingFix
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The IPA is meant to be loaded unsigned (LiveContainer) or
        # re-signed by the user's own tooling — never ship a team here.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: StagingFix
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        # The app talks to the device's own services over the
        # LocalDevVPN loopback tunnel (10.7.0.1).
        NSLocalNetworkUsageDescription: "自分のiPhoneのAFCサービスにローカルVPN経由で接続するために使います。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: IDeviceKit
        product: IDeviceSwift
